<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tetris Login</title>

<link
rel="stylesheet"
href="login.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
rel="stylesheet">

</head>

<body>

<div class="login-box">

    <h1 class="logo">

        TETRIS

    </h1>

    <h2>

        LOGIN

    </h2>

    <input

    id="loginUser"

    type="text"

    placeholder="USERNAME">

    <input

    id="loginPass"

    type="password"

    placeholder="PASSWORD">

    <button

    id="loginBtn">

        LOGIN

    </button>

    <div class="bottom-text">

        Create a new account

        <button

        id="goRegister">

            REGISTER

        </button>

    </div>

</div>

<script src="login.js"></script>

</body>

</html>
