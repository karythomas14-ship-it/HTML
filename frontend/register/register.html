<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tetris Register</title>

<link
rel="stylesheet"
href="register.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
rel="stylesheet">

</head>

<body>

<div class="register-box">

    <h1 class="logo">

        TETRIS

    </h1>

    <h2>

        REGISTER

    </h2>

    <input

    id="registerUser"

    type="text"

    placeholder="USERNAME">

    <input

    id="registerPass"

    type="password"

    placeholder="PASSWORD">

    <button

    id="registerBtn">

        REGISTER

    </button>

    <div class="bottom-text">

        Sign in to your account

        <button

        id="goLogin">

            ĐĂNG NHẬP

        </button>

    </div>

</div>

<script src="register.js"></script>

</body>

</html>
